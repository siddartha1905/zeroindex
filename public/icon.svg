<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192" fill="none">
  <!-- Refined editorial paper seal container -->
  <rect width="192" height="192" rx="42" fill="#FBF8F2"/>
  <rect x="6" y="6" width="180" height="180" rx="36" fill="#FFFFFF" stroke="#DDE2DA" stroke-width="6"/>

  <!-- Pathway 1: Far Left Branch & Leaf -->
  <path d="M 87 123 C 69 114 51 96 45 75" stroke="#285C49" stroke-width="8" stroke-linecap="round"/>
  <path d="M 45 75 C 39 63 45 51 57 54 C 57 66 51 72 45 75 Z" fill="#DDEADD" stroke="#285C49" stroke-width="6"/>

  <!-- Pathway 2: Mid-Left Upward Branch -->
  <path d="M 90 114 C 81 93 72 72 69 45" stroke="#285C49" stroke-width="8" stroke-linecap="round"/>
  <path d="M 69 45 C 60 33 69 24 78 30 C 78 41 73 43 69 45 Z" fill="#8EA89D" stroke="#285C49" stroke-width="6"/>

  <!-- Pathway 3: Central Spire & Growth Crown -->
  <path d="M 96 117 L 96 36" stroke="#285C49" stroke-width="9" stroke-linecap="round"/>
  <path d="M 96 27 C 89 39 93 48 96 51 C 99 48 103 39 96 27 Z" fill="#285C49"/>
  <circle cx="96" cy="21" r="8" fill="#C38A63"/>

  <!-- Pathway 4: Mid-Right Upward Branch -->
  <path d="M 102 114 C 111 93 120 72 123 45" stroke="#285C49" stroke-width="8" stroke-linecap="round"/>
  <path d="M 123 45 C 132 33 123 24 114 30 C 114 41 119 43 123 45 Z" fill="#8EA89D" stroke="#285C49" stroke-width="6"/>

  <!-- Pathway 5: Far Right Branch & Leaf -->
  <path d="M 105 123 C 123 114 141 96 147 75" stroke="#285C49" stroke-width="8" stroke-linecap="round"/>
  <path d="M 147 75 C 153 63 147 51 135 54 C 135 66 141 72 147 75 Z" fill="#DDEADD" stroke="#285C49" stroke-width="6"/>

  <!-- Root support curve -->
  <path d="M 72 153 Q 96 159 120 153" stroke="#285C49" stroke-width="7" stroke-linecap="round" opacity="0.8"/>

  <!-- Symmetrical Origin Ring: Index Zero "0" -->
  <ellipse cx="96" cy="135" rx="21" ry="25" fill="#FFFFFF" stroke="#285C49" stroke-width="9"/>
  <!-- Inner Origin Spark Seed -->
  <circle cx="96" cy="135" r="7.5" fill="#C38A63"/>
</svg>
